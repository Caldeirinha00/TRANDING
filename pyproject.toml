[project]
name = "ai-trading"
version = "0.1.0"
description = "Institutional-grade AI Trading system with MT5 and OpenRouter"
requires-python = ">=3.12"

dependencies = [
    "asyncio",
    "redis>=5.0.0",
    "MetaTrader5>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "questdb>=3.1",
    "qdrant-client>=1.9",
    "openai>=1.14", # Used for OpenRouter API
    "pandas>=2.0.0",
    "psutil>=5.9.0",
    "fastembed>=0.2.0",
    "aiohttp>=3.9.0",
    "defusedxml>=0.7.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
