[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_trading_new"
version = "1.0.0"
description = "Sistema Híbrido Determinístico H4/D1 + Meta-Labeling sob Regulação ESMA (1.000 EUR)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "MetaTrader5>=5.0.45",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "redis>=5.2.0",
    "questdb>=2.0.0",
    "psycopg[binary]>=3.2.3",
    "aiohttp>=3.10.10",
    "structlog>=24.4.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "data*", "strategy*", "risk*", "backtest*", "execution*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
